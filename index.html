<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stick RTS</title>
  <style>
    :root { background: #1a1a1f; color: #e8e8ee; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a1f; }
    body { display: grid; place-items: center; }
    #game-shell { width: min(100dvw, calc(100dvh * 1400 / 540)); aspect-ratio: 1400 / 540; }
    canvas { display: block; width: 100%; height: 100%; background: #2a2a33; image-rendering: pixelated; touch-action: none; }
    #rotate-device { display: none; position: fixed; inset: 0; z-index: 2; padding: 2rem; place-content: center; text-align: center; background: #1a1a1f; font: 600 1.1rem/1.45 system-ui, sans-serif; }
    #rotate-device strong { display: block; margin-bottom: .5rem; font-size: 1.45rem; }
    @media (max-width: 700px) and (orientation: portrait) {
      #game-shell { visibility: hidden; }
      #rotate-device { display: grid; }
    }
  </style>
</head>
<body>
  <div id="game-shell"><canvas id="game"></canvas></div>
  <aside id="rotate-device" aria-live="polite"><strong>Rotate for battlefield view</strong>Stick RTS is designed for a wide tactical view. Turn your phone sideways to play.</aside>
  <script type="module" src="src/main.js"></script>
</body>
</html>
