<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stick RTS</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a1f;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      background: #2a2a33;
      image-rendering: pixelated;
      /* Keep touch drags inside the game so Pointer Events receive them
         instead of the browser treating them as page pan/zoom gestures. */
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
